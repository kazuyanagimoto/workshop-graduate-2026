project:
  type: book
  resources:
    - static/data/
    - static/img/social-card.png

book:
  search: false
  title: "Empiricist's Workflow"
  subtitle: 実証研究のためのモダンなツールと作法
  author:
    - name: 柳本和春
      email: yanagimoto@econ.kobe-u.ac.jp
      orcid: 0009-0007-1967-8304
      affiliations:
        - name: 神戸大学
  date: last-modified
  date-format: "YYYY年MM月DD日"
  site-url: https://kazuyanagimoto.com/workshop-graduate-2026
  repo-url: https://github.com/kazuyanagimoto/workshop-graduate-2026
  favicon: static/img/logo/hex-logo.svg
  open-graph:
    image: static/img/social-card.png
  twitter-card:
    card-style: summary_large_image
    image: static/img/social-card.png
  sidebar:
    logo: static/img/logo/hex-logo.svg
  chapters:
    - index.qmd
    - lesson/architecture.qmd
    - lesson/shell.qmd
    - lesson/git.qmd
    - lesson/quarto.qmd
    - lesson/speedup.qmd
    - lesson/large-data.qmd
    - lesson/api.qmd
    - lesson/visualization.qmd
    - lesson/regression.qmd
    - lesson/slides.qmd
    - lesson/literature.qmd
    - lesson/targets.qmd
    - lesson/ai.qmd
  appendices:
    - lesson/dictionary.qmd
    - lesson/color.qmd
    - references.qmd

website:
  llms-txt: true

format:
  html:
    code-tools: true
    df-print: paged
    theme:
      - cosmo
      - brand
    highlight-style: atom-one
    css: styles.css
    include-after-body: static/include/quiz.html
    toc: true
    number-depth: 2
    lightbox: true


freeze: auto
execute:
  warning: false
  message: false
  error: false

bibliography: references.bib
bibliography-style: chicago-author-date
link-citations: true

knitr:
  opts_chunk: 
    fig.align: center
    fig.retina: 3
    fig.width: 8
    fig.height: 3.708
    out.width: 90%
    collapse: true
    dev: svg