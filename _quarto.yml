project:
  type: book
  pre-render: scripts/update-quarto-version.sh
  resources:
    - static/data/
    - static/img/social-card.png

book:
  search: false
  title: "Empiricist's Workflow"
  subtitle: 実証研究のためのモダンなツールと作法
  output-file: empiricists-workflow
  downloads: [pdf]
  author:
    - name: 柳本和春
      email: yanagimoto@econ.kobe-u.ac.jp
      orcid: 0009-0007-1967-8304
      affiliations:
        - name: 神戸大学
  date: last-modified
  date-format: "YYYY年MM月DD日"
  site-url: https://kazuyanagimoto.com/workshop-graduate-2026
  repo-url: https://github.com/kazuyanagimoto/workshop-graduate-2026
  favicon: static/img/logo/hex-logo.svg
  open-graph:
    image: static/img/social-card.png
  twitter-card:
    card-style: summary_large_image
    image: static/img/social-card.png
  sidebar:
    logo: static/img/logo/hex-logo.svg
  chapters:
    - index.qmd
    - lesson/architecture.qmd
    - lesson/environment.qmd
    - lesson/git.qmd
    - lesson/speedup.qmd
    - lesson/largedata.qmd
    - lesson/api.qmd
    - lesson/visualization.qmd
    - lesson/regression.qmd
    - lesson/slides.qmd
    - lesson/literature.qmd
    - lesson/targets.qmd
    - lesson/ai.qmd
  appendices:
    - lesson/shell.qmd
    - lesson/quarto.qmd
    - lesson/dictionary.qmd
    - lesson/color.qmd
    - references.qmd

website:
  llms-txt: true

format:
  html:
    code-tools: true
    df-print: paged
    theme:
      - cosmo
      - brand
    highlight-style: atom-one
    css: styles.css
    include-after-body: static/include/quiz.html
    toc: true
    number-depth: 2
    lightbox: true
  pdf:
    lang: ja
    documentclass: ltjsbook
    pdf-engine: lualatex
    mainfont: TeX Gyre Termes
    CJKmainfont: Harano Aji Mincho
    sansfont: Harano Aji Gothic
    monofont: JuliaMono
    geometry:
      - margin=1in
    toc-depth: 2
    number-depth: 2
    linkcolor: primary
    citecolor: primary
    urlcolor: primary
    include-in-header:
      - text: |
          \definecolor{primary}{HTML}{107895}
          \ltjsetparameter{jacharrange={-2, -3}}
          % This book is code-heavy: wrap long lines inside code blocks
          % instead of letting them run past the right margin.
          \usepackage{fvextra}
          \DefineVerbatimEnvironment{Highlighting}{Verbatim}{%
            breaklines,breakanywhere,commandchars=\\\{\}}
          % tinytable emits column names such as `bill_len` unescaped into the
          % tabularray body, which is a LaTeX error in text mode. This makes a
          % bare `_` typeset as an underscore while leaving math subscripts
          % alone, so table code needs no per-table escaping.
          \usepackage[strings]{underscore}
          % Some tables sit inside callouts (the collapsible 解答例 blocks),
          % and a LaTeX float cannot open inside the tcolorbox a callout
          % becomes. Pin tables in place instead of letting them float, which
          % also keeps their position consistent with the HTML edition.
          \usepackage{float}
          \restylefloat{table}
          \floatplacement{table}{H}


freeze: auto
execute:
  warning: false
  message: false
  error: false

filters:
  - filters/gif-still.lua

bibliography: references.bib
bibliography-style: chicago-author-date
link-citations: true

knitr:
  opts_chunk:
    fig.align: center
    fig.retina: 3
    fig.width: 8
    fig.height: 3.708
    out.width: 90%
    collapse: true
    dev: svg
