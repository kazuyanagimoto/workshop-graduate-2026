<svg xmlns="http://www.w3.org/2000/svg" width="512" height="592" viewBox="0 0 512 592">
  <defs>
    <!-- Brand palette: accent #107895, accent2 #9a2515, pink #e64173, jet #131516 -->
    <linearGradient id="hexFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17a0b8"/>
      <stop offset="0.55" stop-color="#107895"/>
      <stop offset="1" stop-color="#0b5d72"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Hexagon (pointy-top): fill + edge-hugging border, tidyverse style -->
  <path d="M256 14 L500.2 155 L500.2 437 L256 578 L11.8 437 L11.8 155 Z"
        fill="url(#hexFill)" stroke="#63c4d6" stroke-width="18" stroke-linejoin="round"/>
  <!-- Top gloss -->
  <path d="M256 30 L488 163 L488 296 L24 296 L24 163 Z" fill="url(#gloss)"/>

  <!-- Code editor / terminal card, centred -->
  <g>
    <rect x="76" y="172" width="360" height="248" rx="26" fill="#f5f7f8"/>
    <!-- Title bar dots (brand colours) -->
    <circle cx="106" cy="200" r="10" fill="#9a2515"/>
    <circle cx="140" cy="200" r="10" fill="#e64173"/>
    <circle cx="174" cy="200" r="10" fill="#107895"/>
    <line x1="76" y1="228" x2="436" y2="228" stroke="#e2e8ea" stroke-width="2"/>

    <!-- Prompt chevron + cursor -->
    <path d="M128 262 L164 290 L128 318" fill="none" stroke="#107895"
          stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="182" y="266" width="22" height="48" rx="5" fill="#e64173"/>

    <!-- Syntax-highlighted code lines -->
    <rect x="128" y="356" width="70"  height="20" rx="10" fill="#9a2515"/>
    <rect x="212" y="356" width="160" height="20" rx="10" fill="#b9c4c9"/>
    <rect x="128" y="390" width="108" height="20" rx="10" fill="#107895" fill-opacity="0.55"/>
    <rect x="250" y="390" width="96"  height="20" rx="10" fill="#b9c4c9"/>
  </g>
</svg>
