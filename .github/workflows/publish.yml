name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow pushing the rendered site to the gh-pages branch
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The CeTZ diagrams are SVG, which LaTeX cannot include directly; Quarto
      # converts them with rsvg-convert.
      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      # TinyTeX comes from r-lib rather than quarto-actions' `tinytex: true`,
      # which installs it but exports its bin directory to PATH on macOS and
      # Windows only.
      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      # Quarto auto-installs missing .sty files during the render, but not
      # fonts, so the ones named in _quarto.yml have to be pulled in by hand.
      - name: Install fonts for the PDF
        run: tlmgr install haranoaji juliamono tex-gyre

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Unlike the HTML edition, the PDF is one document: Quarto merges the
      # chapters and runs the result through knitr once, so the engine has to
      # be present even though nothing is executed.
      - name: Install the knitr engine
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      # Only the engine is installed, not the packages the chapters use, so
      # chunk output still has to come from _freeze/ (freeze: auto) -- and now
      # from a committed tex.json beside each html.json, since both formats are
      # built here. A chunk edited without a local re-render fails this step
      # rather than being executed.
      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
