name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow pushing the rendered site to the gh-pages branch
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      # The PDF is typeset by Typst, which ships with Quarto -- no TeX
      # distribution is installed here. Typst resolves fonts by name from the
      # system, and neither family is packaged for Ubuntu, so both come from
      # upstream. The whole Harano Aji set is installed rather than just the
      # regular faces: the jsbook template asks for weight 450, which picks a
      # different face depending on what is available.
      - name: Install fonts for the PDF
        env:
          HARANOAJI_VERSION: "20250811"
          JULIAMONO_VERSION: v0.63.2
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL "https://github.com/trueroad/HaranoAjiFonts/archive/refs/tags/${HARANOAJI_VERSION}.tar.gz" \
            | tar -xz -C ~/.local/share/fonts --strip-components=1 --wildcards '*.otf'
          curl -fsSL "https://github.com/cormullion/juliamono/releases/download/${JULIAMONO_VERSION}/JuliaMono-ttf.tar.gz" \
            | tar -xz -C ~/.local/share/fonts
          fc-cache -f
          # Typst silently substitutes a default face for a font it cannot
          # find, so fail here instead of publishing a PDF in the wrong font.
          # `quarto typst fonts` lists them on stderr, hence the redirect.
          quarto typst fonts 2>&1 | tee /tmp/typst-fonts.txt > /dev/null
          for font in "Harano Aji Mincho" "Harano Aji Gothic" "JuliaMono"; do
            grep -qF "$font" /tmp/typst-fonts.txt || { echo "missing font: $font"; exit 1; }
          done

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Unlike the HTML edition, the PDF is one document: Quarto merges the
      # chapters and runs the result through knitr once, so the engine has to
      # be present even though nothing is executed.
      - name: Install the knitr engine
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      # Only the engine is installed, not the packages the chapters use, so
      # chunk output still has to come from _freeze/ (freeze: auto) -- and now
      # from a committed typ.json beside each html.json, since both formats are
      # built here. A chunk edited without a local re-render fails this step
      # rather than being executed.
      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
