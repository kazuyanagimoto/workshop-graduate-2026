title: jsarticle (Typst)
author: Kazuharu Yanagimoto
version: 0.0.2
quarto-required: ">=1.8.0"
contributes:
  shortcodes:
    - js-shortcodes.lua
  # Also exposed as an extension filter so that other formats can opt in with
  # `filters: [jsarticle]` and get the HTML / plain-text fallbacks.
  filters:
    - path: js-macros.lua
      at: post-quarto
  formats:
    typst:
      lang: ja
      papersize: a4
      number-sections: true
      section-numbering: "1.1.1"
      template-partials:
        - typst-template.typ
        - typst-show.typ
        - page.typ
      filters:
        - path: js-macros.lua
          at: post-quarto
