project:
  type: book
  pre-render: scripts/update-quarto-version.sh
  resources:
    - static/data/
    - static/img/social-card.png

book:
  search: false
  title: "Empiricist's Workflow"
  subtitle: 実証研究のためのモダンなツールと作法
  output-file: empiricists-workflow
  downloads: [pdf]
  author:
    - name: 柳本和春
      email: yanagimoto@econ.kobe-u.ac.jp
      orcid: 0009-0007-1967-8304
      affiliations:
        - name: 神戸大学
  date: last-modified
  date-format: "YYYY年MM月DD日"
  site-url: https://kazuyanagimoto.com/workshop-graduate-2026
  repo-url: https://github.com/kazuyanagimoto/workshop-graduate-2026
  favicon: static/img/logo/hex-logo.svg
  open-graph:
    image: static/img/social-card.png
  twitter-card:
    card-style: summary_large_image
    image: static/img/social-card.png
  sidebar:
    logo: static/img/logo/hex-logo.svg
  page-footer:
    left: |
      © 2026 柳本和春. 文章・図は [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/), コードは [MIT License](https://github.com/kazuyanagimoto/workshop-graduate-2026/blob/main/LICENSE.md) の下で公開されています.
  chapters:
    - index.qmd
    - lesson/architecture.qmd
    - lesson/environment.qmd
    - lesson/git.qmd
    - lesson/speedup.qmd
    - lesson/largedata.qmd
    - lesson/api.qmd
    - lesson/visualization.qmd
    - lesson/regression.qmd
    - lesson/slides.qmd
    - lesson/literature.qmd
    - lesson/targets.qmd
    - lesson/ai.qmd
  appendices:
    - lesson/shell.qmd
    - lesson/quarto.qmd
    - lesson/dictionary.qmd
    - lesson/color.qmd
    - references.qmd

website:
  llms-txt: true

format:
  html:
    code-tools: true
    df-print: paged
    theme:
      - cosmo
      - brand
    highlight-style: atom-one
    css: styles.css
    include-after-body: static/include/quiz.html
    toc: true
    number-depth: 2
    lightbox: true
  # The PDF is typeset by Typst, not LaTeX: no TeX distribution is needed to
  # build the book, SVG figures are embedded directly (no rsvg-convert), and
  # long lines inside code blocks wrap on their own.
  jsbook-typst:
    CJKmainfont: Harano Aji Mincho
    CJKsansfont: Harano Aji Gothic
    codefont: JuliaMono
    toc-depth: 2
    number-depth: 2
    linkcolor: "#107895"
    citecolor: "#107895"
    filecolor: "#107895"
    # Use citeproc so the bibliography lands in the #refs div of references.qmd
    # instead of Typst's native #bibliography (which would duplicate the heading).
    citeproc: true

freeze: auto
execute:
  warning: false
  message: false
  error: false

filters:
  - filters/gif-still.lua

bibliography: references.bib
bibliography-style: chicago-author-date
link-citations: true

knitr:
  opts_chunk:
    fig.align: center
    fig.retina: 3
    fig.width: 8
    fig.height: 3.708
    out.width: 90%
    collapse: true
    dev: svg
