name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow pushing the rendered site to the gh-pages branch
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # R is not installed on the runner: all R chunks must be pre-rendered
      # locally and committed to _freeze/ (freeze: auto). If a chunk is edited
      # without re-rendering locally, this step fails instead of executing R.
      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
